syntax = "proto3";

package aspiresnippetpb;

message EmbeddingClusterSnippet {
  repeated EmbeddingSnippet embedding_snippet = 1;
}

message EmbeddingSnippet {
  bytes embedding_fp16 = 1;
  oneof ranking_signals {
    ArtRankingSignals art_signals = 2;
    BookRankingSignals book_signals = 3;
    AnimalRankingSignals animal_signals = 4;
    LandmarkRankingSignals landmark_signals = 5;
    PetRankingSignals pet_signals = 6;
  }
  DebugInfo debug_info = 7;
  int32 cluster_rank = 8;
}

message ArtRankingSignals {
  uint32 kg_entity_id = 1;
  float popularity_score = 2;
}

message BookRankingSignals {
  uint64 book_adam_id = 1;
  repeated int32 supported_storefronts = 2;
  string language = 3;
  reserved 4;
  repeated AMPSignals web_matched = 5;
}

message AMPSignals {
  uint64 book_adam_id = 1;
  reserved 2;
  reserved 3;
  reserved 4;
}

message AnimalRankingSignals {
  uint32 kg_entity_id = 1;
}

message PetRankingSignals {
  uint32 kg_entity_id = 1;
}

message LandmarkRankingSignals {
  uint32 kg_entity_id = 1;
  float popularity_score = 2;
  float coverage = 3;

  message Point {
    double lat = 1;
    double lng = 2;
  }
  Point location = 4;
}

message DebugInfo {
  string doc_url = 1;
  string image_url = 2;
}
