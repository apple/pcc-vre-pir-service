syntax = "proto3";

package aspireresultpb;

import "serving/proto/aspiresnippetpb/embedding_cluster_snippet.proto";
import "serving/proto/aspiresnippetpb/asset_metadata_snippet.proto";

message AspireResult {
  reserved 1, 2, 3, 4, 7;

  oneof snippet {
    aspiresnippetpb.EmbeddingClusterSnippet embedding_cluster = 5;
    aspiresnippetpb.AssetMetadataSnippet asset_metadata = 6;
  }
}
